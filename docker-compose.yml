services:
  # Base de datos MySQL. Al crearse por primera vez ejecuta el script de src/sql
  mysql:
    image: mysql:5.7
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dbserverexpress26
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Backend ServerExpress. Espera a que MySQL esté listo
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PUERTO=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=dbserverexpress26
      - DB_USER=root
      - DB_PASSWORD=root
      - JWT_SECRET=clave_secreta_server_express_26
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Front React (ProyectoIntegradorTLP3) servido con nginx en http://localhost:8080
  front:
    build: ../../ProyectoIntegradorTLP3
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql_data:
